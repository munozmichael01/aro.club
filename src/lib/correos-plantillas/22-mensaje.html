<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>{{ asunto }} · Aro Club</title>
<style>
  @font-face { font-family: 'Inter Tight'; font-style: normal; font-weight: 400; font-display: swap; src: url(https://fonts.gstatic.com/s/intertight/v7/NGSwv5HMAFg6IuGlBNMjxJEL2VmU3NS7Z2mjDw.woff2) format('woff2'); }
  @font-face { font-family: 'Inter Tight'; font-style: normal; font-weight: 600; font-display: swap; src: url(https://fonts.gstatic.com/s/intertight/v7/NGSwv5HMAFg6IuGlBNMjxJEL2VmU3NS7Z2mjDw.woff2) format('woff2'); }
  @font-face {
    font-family: 'Young Serif';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url(https://fonts.gstatic.com/s/youngserif/v2/3qTpojO2nS2VtkB3KtkQZ2t6.ttf) format('truetype');
  }
  @media (max-width:620px){ .w{width:100% !important} .p{padding-left:22px !important;padding-right:22px !important} }
</style>
</head>
<body style="margin:0;padding:0;background:#FAF3E4;">
<span style="display:none;font-size:1px;color:#FAF3E4;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{{ adelanto }}</span>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#FAF3E4" style="background:#FAF3E4;">
<tr><td align="center" bgcolor="#FAF3E4" style="padding:0;">

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="w" style="width:600px;max-width:600px;background:#FAF3E4;">

  <tr><td class="p" style="padding:30px 40px 0 40px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
      <td style="padding-right:11px;" valign="middle">
        <img src="{{{ sitioWeb }}}/correo/aro-verde.png" width="22" height="22" alt="" style="display:block;width:22px;height:22px;border:0;" />
      </td>
      <td style="font-family:'Young Serif',Georgia,'Times New Roman',serif;font-weight:700;font-size:21px;line-height:21px;color:#14342A;mso-line-height-rule:exactly;">Aro&nbsp;Club</td>
    </tr></table>
  </td></tr>

  <!-- Sin titular ni sello. Esto no es un aviso del producto: es una persona
       escribiendo a otra, y un «TU MESA» de cuarenta y dos píxeles encima
       convertiría una pregunta en una notificación. -->
  {{#cada parrafos}}
  <tr><td class="p" style="padding:22px 40px 0 40px;font-family:'Inter Tight',Arial,Helvetica,sans-serif;font-size:17px;line-height:27px;color:#2C4A38;mso-line-height-rule:exactly;">
    {{ . }}
  </td></tr>
  {{/cada}}

  <tr><td class="p" style="padding:26px 40px 0 40px;font-family:'Inter Tight',Arial,Helvetica,sans-serif;font-size:17px;line-height:27px;color:#2C4A38;mso-line-height-rule:exactly;">
    Respóndenos a este mismo correo.
  </td></tr>

  <tr><td class="p" style="padding:34px 40px 40px 40px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td height="1" bgcolor="#D8CFB6" style="height:1px;line-height:1px;font-size:0;">&nbsp;</td></tr></table>
    <p style="margin:20px 0 0 0;font-family:'Inter Tight',Arial,Helvetica,sans-serif;font-size:13px;line-height:21px;color:#566A5D;mso-line-height-rule:exactly;">
      Aro Club · Caracas, Venezuela<br />
      Te escribimos a mano por algo tuyo, no es un aviso automático.<br />
      <a href="{{{ sitioWeb }}}/legal" style="color:#566A5D;text-decoration:underline;">Términos y privacidad</a>
    </p>
  </td></tr>

</table>
</td></tr></table>
</body></html>
