# Lo que tiene que pasar antes de que algo llegue a main.
#
# Existe porque hasta ahora dependía de que alguien se acordara de correr los
# comprobadores antes de un push, y eso es el mismo modo de fallo que vienen a
# quitar: silencioso y solo cuando importa.
#
# `comprobar-pantallas` es el que hacía más falta. `tsc` y eslint no ven ni una
# de las quince mil líneas de `public/*.dc.html`, y de ahí salió todo lo que se
# rompió sin avisar: un `</sc-if>` cruzado que dejó el botón de Continuar sin
# pintarse durante semanas, un `{{#cada}}` a caballo de una tabla, enlaces a
# rutas que devolvían 404.
name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Los tipos: el CI los exige y el dev server no los caza.
      - name: Tipos
        run: npx tsc --noEmit

      - name: Estilo
        run: npx eslint

      # Las pantallas. No necesita base de datos ni red: lee los ficheros y
      # las rutas de `next.config.ts`.
      - name: Pantallas
        run: node scripts/comprobar-pantallas.mjs

      # Los correos: que ningún botón lleve a un 404 y que las plantillas
      # cierren al repetir la lista de comensales.
      - name: Correos
        run: node scripts/comprobar-correos.mjs

      # El cuestionario compara la pantalla con el catalogo de la base.
      #
      # Con la llave PUBLICA, que es la que ya viaja a todos los navegadores
      # que abren aro.club: `questions` tiene que ser legible o el
      # cuestionario no se pintaria. Aqui no hay ningun secreto.
      #
      # Antes pedia la de servicio —la que salta RLS y lee cualquier tabla—
      # y por no estar puesta este paso llevaba un mes saltandose solo, que
      # es justo el modo de fallo que el CI viene a quitar. Un comprobador
      # que no corre no comprueba nada.
      - name: Cuestionario
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qdydmklrbsdemzvjsldo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkeWRta2xyYnNkZW16dmpzbGRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTkwNzUsImV4cCI6MjEwMTI3NTA3NX0.F-epUAJHkqaSpmTFgQeeuQcn29POFk_Ier7YhxnlNOI
        run: node scripts/comprobar-cuestionario.mjs
