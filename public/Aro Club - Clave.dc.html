<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icono-512.png">
<script src="./errores.js"></script>
<script src="./support.js"></script>
</head>
<body>
<noscript><div style="max-width:34rem;margin:14vh auto;padding:0 24px;font:400 17px/1.6 system-ui,sans-serif;color:#14342A"><p style="font:700 26px/1.2 Georgia,serif;margin:0 0 12px">Esta pantalla necesita JavaScript.</p><p style="margin:0 0 12px">Aro Club no funciona con JavaScript desactivado. Actívalo y recarga, o escríbenos a <a href="mailto:hola@aro.club" style="color:#1B5138">hola@aro.club</a> y lo resolvemos por ahí.</p></div></noscript>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body { margin:0; background:#14342A; -webkit-font-smoothing:antialiased; }
  * { box-sizing: border-box; }
  em { font-style: normal; }
  a { color:#FAF3E4; text-decoration:none; }
  a:hover { color:#E39C63; }
  input, button { font: inherit; color: inherit; }
  ::selection { background:#FAF3E4; color:#14342A; }
  ::placeholder { color:#7E9A8B; }
  @keyframes aro-open { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:none } }
  @keyframes aro-spin { to { transform: rotate(360deg) } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration:.001ms !important; transition-duration:.001ms !important; } }
</style>
</helmet>

<div style="{{ pagina }}">
  <div style="{{ caja }}">

    <a href="/" style="{{ marca }}">Aro Club</a>

    <sc-if value="{{ hayToken }}" hint-placeholder-val="{{ true }}">
      <div>
        <h1 style="{{ h1 }}">{{ titulo }}</h1>
        <p style="{{ bajada }}">{{ bajada2 }}</p>

        <input type="password" value="{{ clave }}" onChange="{{ onClave }}"
               placeholder="Tu contraseña nueva" autocomplete="new-password"
               aria-label="Contraseña nueva" style="{{ campo }}" />

        <div style="{{ pista }}">{{ textoPista }}</div>

        <sc-if value="{{ hayFallo }}" hint-placeholder-val="{{ false }}">
          <div style="{{ bandaFallo }}">{{ fallo }}</div>
        </sc-if>

        <button onClick="{{ guardar }}" aria-disabled="{{ inerte }}" style="{{ boton }}">{{ textoBoton }}</button>
      </div>
    </sc-if>

    <sc-if value="{{ hecho }}" hint-placeholder-val="{{ false }}">
      <div>
        <h1 style="{{ h1 }}">Listo.</h1>
        <p style="{{ bajada }}">Ya puedes entrar con tu contraseña nueva.</p>
        <a href="/entrar" style="{{ boton }}">Entrar</a>
      </div>
    </sc-if>

    <sc-if value="{{ sinToken }}" hint-placeholder-val="{{ false }}">
      <div>
        <h1 style="{{ h1 }}">Este enlace ya no vale.</h1>
        <p style="{{ bajada }}">Los enlaces para cambiar la contraseña caducan. Pide otro y te llega en un momento.</p>
        <a href="/entrar" style="{{ boton }}">Pedir otro</a>
      </div>
    </sc-if>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { clave: '', enviando: false, fallo: '', hecho: false, token: null, leido: false };

  componentDidMount() {
    // Supabase devuelve el token en el FRAGMENTO de la URL —después de la
    // almohadilla— y eso no viaja al servidor: solo lo ve el navegador. Por
    // eso esta pantalla tiene que leerlo aquí y mandarlo ella.
    var h = (window.location.hash || '').replace(/^#/, '');
    var p = new URLSearchParams(h);
    var t = p.get('access_token');
    // Y se borra de la barra en cuanto se lee: un enlace que da acceso a una
    // cuenta no debería quedarse en el historial ni en una captura.
    if (t) history.replaceState(null, '', window.location.pathname);
    this.setState({ token: t, leido: true });
  }

  guardar() {
    var s = this.state;
    if (s.enviando || String(s.clave).length < 8) return;
    this.setState({ enviando: true, fallo: '' });
    fetch('/api/clave', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: s.token, clave: s.clave })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok) { this.setState({ enviando: false, fallo: x.d.error || 'No se pudo.' }); return; }
        // La contraseña sale del estado en cuanto deja de hacer falta.
        this.setState({ enviando: false, hecho: true, clave: '', token: null });
      }.bind(this))
      .catch(function () { this.setState({ enviando: false, fallo: 'No se pudo. Vuelve a intentarlo.' }); }.bind(this));
  }

  renderVals() {
    var s = this.state;
    var larga = String(s.clave).length >= 8;
    var listo = larga && !s.enviando;

    return {
      // Hasta que no se ha leído la URL no se pinta ninguna de las tres: si
      // no, se ve medio segundo de «este enlace ya no vale» a quien lo tiene
      // perfectamente bien.
      hayToken: s.leido && !!s.token && !s.hecho,
      sinToken: s.leido && !s.token && !s.hecho,
      hecho: s.hecho,

      titulo: 'Pon una contraseña nueva.',
      bajada2: 'La anterior deja de funcionar en cuanto guardes esta.',
      clave: s.clave,
      onClave: function (e) { this.setState({ clave: e.target.value, fallo: '' }); }.bind(this),
      textoPista: larga ? 'Bien.' : 'Al menos ocho caracteres.',
      hayFallo: !!s.fallo,
      fallo: s.fallo,
      inerte: listo ? null : 'true',
      textoBoton: s.enviando ? 'Guardando…' : (larga ? 'Guardar y entrar' : 'Al menos ocho caracteres'),
      guardar: this.guardar.bind(this),

      pagina: 'min-height:100vh;background:#14342A;display:flex;align-items:center;justify-content:center;padding:clamp(20px,5vw,48px)',
      caja: 'width:100%;max-width:440px',
      marca: "display:block;font:400 20px/1 'Young Serif',Georgia,serif;color:#FAF3E4;letter-spacing:-.02em;margin-bottom:clamp(28px,5vw,44px)",
      h1: "font:400 clamp(30px,6vw,40px)/1.08 'Young Serif',Georgia,serif;letter-spacing:-.03em;color:#FAF3E4;margin:0",
      bajada: "font:400 16px/1.6 'Inter Tight',sans-serif;color:#9CBBA6;margin:12px 0 28px;max-width:38ch",
      campo: "width:100%;min-height:56px;padding:0 20px;border-radius:999px;border:1px solid rgba(250,243,228,.28);background:rgba(250,243,228,.06);color:#FAF3E4;font:400 16px/1 'Inter Tight',sans-serif;outline:none",
      pista: "font:400 13px/1.5 'Inter Tight',sans-serif;color:" + (larga ? '#9CBBA6' : '#7E9A8B') + ';margin:10px 4px 0',
      bandaFallo: "border-radius:16px;background:rgba(192,102,47,.16);border:1px solid rgba(192,102,47,.5);color:#E39C63;font:400 14px/1.5 'Inter Tight',sans-serif;padding:12px 16px;margin-top:14px",
      boton: 'display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:20px;padding:0 24px;border-radius:999px;border:none;background:' + (listo ? '#FAF3E4' : 'rgba(250,243,228,.14)') + ';color:' + (listo ? '#14342A' : '#7E9A8B') + ";font:600 16px/1 'Inter Tight',sans-serif;cursor:" + (listo ? 'pointer' : 'not-allowed')
    };
  }
}
</script>
</html>
