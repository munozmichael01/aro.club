<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Aro Club">
  <!--
    El isotipo: un aro y seis puntos alrededor. Los seis son las seis
    personas de la mesa, y uno es naranja porque siempre hay alguien que
    llega primero.

    Va en SVG y no en .ico por el tamaño al que se ve de verdad: a 16 píxeles
    un .ico de mapa de bits emborrona el aro y los puntos se juntan. El SVG
    se dibuja nítido a cualquier tamaño y pesa una décima parte.

    El fondo va DENTRO del icono, no transparente: en la barra de pestañas
    oscura un aro verde sobre nada desaparece.
  -->
  <rect width="32" height="32" rx="7" fill="#FAF3E4"/>
  <g transform="translate(16 16)">
    <circle r="7.6" fill="none" stroke="#14342A" stroke-width="2.1"/>
    <circle cx="9.6" cy="0" r="2.1" fill="#8F4515"/>
    <circle cx="4.8" cy="8.31" r="2.1" fill="#14342A"/>
    <circle cx="-4.8" cy="8.31" r="2.1" fill="#14342A"/>
    <circle cx="-9.6" cy="0" r="2.1" fill="#14342A"/>
    <circle cx="-4.8" cy="-8.31" r="2.1" fill="#14342A"/>
    <circle cx="4.8" cy="-8.31" r="2.1" fill="#14342A"/>
  </g>
</svg>
